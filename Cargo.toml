[workspace]
resolver = "2"
members = [
    "crates/hyprpilot-core",
    "crates/hyprpilot-daemon",
    "crates/hyprpilot-cli",
    "crates/hyprpilot-mcp",
    "crates/hyprpilot-input",
    "crates/hyprpilot-vision",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Luffy/HyprPilot"
rust-version = "1.75"

[workspace.dependencies]
hyprpilot-core = { path = "crates/hyprpilot-core", version = "0.1.0" }
hyprpilot-daemon = { path = "crates/hyprpilot-daemon", version = "0.1.0" }
hyprpilot-input = { path = "crates/hyprpilot-input", version = "0.1.0" }
hyprpilot-vision = { path = "crates/hyprpilot-vision", version = "0.1.0" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "sync", "signal", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "0.8"
toml = "0.8"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
